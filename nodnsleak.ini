custom_proxy_group=💃 TikTok`select`[]DIRECT`[]所有-手动`[]所有-自动`[]香港-自动`[]新加坡-自动`[]美国-自动`[]REJECT
custom_proxy_group=🚀 节点选择`select`[]DIRECT`[]所有-手动`[]所有-自动`[]香港-自动`[]新加坡-自动`[]美国-自动`[]REJECT

custom_proxy_group=所有-手动`select`.*
custom_proxy_group=所有-自动`url-test`.*`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=香港-自动`url-test`(广港|香港|HK|Hong Kong|🇭🇰|HongKong)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=新加坡-自动`url-test`(广新|新加坡|SG|坡|狮城|🇸🇬|Singapore)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=美国-自动`url-test`(广美|美|US|纽约|波特兰|达拉斯|俄勒|凤凰城|费利蒙|硅谷|拉斯|洛杉|圣何塞|圣克拉|西雅|芝加|🇺🇸|United States)`http://www.gstatic.com/generate_204`300,,50

enable_rule_generator=true
overwrite_original_rules=true
